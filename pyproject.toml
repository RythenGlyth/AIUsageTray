[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-usage-tray"
version = "0.1.0"
description = "System tray monitor for AI usage limits (Antigravity, OpenAI Codex, Claude, Gemini, Copilot)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.4",
    "keyring>=24.0",
    "requests>=2.31",
    "cryptography>=41.0",
    'secretstorage>=3.3; sys_platform == "linux"',
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
ai-usage-tray = "ai_usage_tray.main:main"

[tool.setuptools.packages.find]
include = ["ai_usage_tray*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
